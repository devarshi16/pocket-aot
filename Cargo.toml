[package]
name = "pocket-arcade"
version = "0.1.0"
edition = "2021"
default-run = "pocket-arcade"
description = "Experimental PICO-8 to RP2040 ahead-of-time compiler, runtime and retro desktop launcher"
license = "GPL-3.0-only"
repository = "https://github.com/devarshi16/pocket-aot"
readme = "README.md"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "__screenshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
strip = true

